<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./index.js" defer type="module"></script>
</head>
<body>
        <form action="" id="sign-in" style="display: none;">
            <h1>Sign_In</h1>
            <input type="email" placeholder="Email" autocomplete="on"><br><br>
            <input type="password" placeholder="password"><br><br>
            <input type="submit">
        </form>
        <button id="btn1" style="display: none;">Create An account</button>

        <form action="" id="sign-up" >
            <h1>Sign-Up</h1>
            <input type="email" placeholder="Email:"><br><br>
            <input type="password" placeholder="enter password"><br><br>
            <input type="password" placeholder="Re-enter password"><br><br>
            <input type="submit">
            </form><br>
            <button id="btn2">already have an account</button>
</body>
</html>
